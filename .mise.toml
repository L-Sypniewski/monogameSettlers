# Runtime + CLI tool versions for host and Dev Container - mise resolves this file from any subdirectory.
# CI keeps its own setup-dotnet 9.0.x step.
[tools]
node = "24"
dotnet = "9.0"
bun = "1.3.14"

[settings]
# Isolated dotnet installs: a co-installed SDK cannot win over the pinned one.
dotnet.isolated = true
